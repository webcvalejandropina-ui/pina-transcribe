name: pina

# Configuración opcional: copia pina.env.example a pina.env y ajústalo.
# Con launch_docker.py se carga automáticamente; a mano:
#   docker compose --env-file pina.env up -d --build transcribe

x-common: &common
  ports:
    - "${BIND_ADDRESS:-127.0.0.1}:${PINA_PORT:-15000}:15000"
  restart: unless-stopped
  init: true
  read_only: true
  # Si el modelo se pasa de memoria, Docker detiene solo este contenedor.
  mem_limit: "${PINA_MEM_LIMIT:-6g}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    YTDLP_PROXY: "${YTDLP_PROXY:-}"
    YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"
    PINA_CPU_THREADS: "${PINA_CPU_THREADS:-}"
    PINA_KEEP_MODEL: "${PINA_KEEP_MODEL:-1}"
  volumes:
    - outputs-data:/app/outputs
    - logs-data:/app/logs
    - model-cache:/home/app/.cache/huggingface
  tmpfs:
    - /app/temp:uid=10001,gid=10001,mode=0700
    - /tmp:uid=10001,gid=10001,mode=1777

services:
  transcribe:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
    image: pina-transcribe:cpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # UI web: http://localhost:15000  |  Logs: docker compose logs -f transcribe
    # Launcher TTY: docker compose run --rm -it transcribe launcher
    # CLI: docker compose run --rm transcribe youtube ID --start 1:00 --end 2:30

  transcribe-gpu:
    <<: *common
    profiles:
      - gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: pina-transcribe:gpu
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  model-cache:
  outputs-data:
  logs-data:
