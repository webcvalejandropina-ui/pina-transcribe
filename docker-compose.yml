name: pina

services:
  transcribe:
    build:
      context: .
      dockerfile: Dockerfile
    image: pina-transcribe:cpu
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PINA_PORT:-15000}:15000"
    stdin_open: false
    tty: false
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"
    volumes:
      - outputs-data:/app/outputs
      - logs-data:/app/logs
      - model-cache:/home/app/.cache/huggingface
    tmpfs:
      - /app/temp:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # UI web: http://localhost:15000  |  Consola: docker compose logs -f transcribe
    # Launcher TTY: docker compose run --rm -it transcribe launcher
    # CLI: docker compose run --rm transcribe youtube ID --cpu

  transcribe-gpu:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: pina-transcribe:gpu
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PINA_PORT:-15000}:15000"
    stdin_open: false
    tty: false
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"
    volumes:
      - outputs-data:/app/outputs
      - logs-data:/app/logs
      - model-cache:/home/app/.cache/huggingface
    tmpfs:
      - /app/temp:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  model-cache:
  outputs-data:
  logs-data:
